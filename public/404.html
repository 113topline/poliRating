<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>poliRating</title>
    <!--
      GitHub Pages SPA redirect trick.
      When GH Pages 404s on a deep link (e.g. /poliRating/review/abc),
      it serves this file. We save the intended URL to sessionStorage and
      redirect to the app root so Vue Router can restore it client-side.
      The receiver script lives in index.html (already present).
    -->
    <script>
      sessionStorage.setItem('spa-redirect', window.location.pathname + window.location.search + window.location.hash)
      window.location.replace(
        window.location.origin + '/' + window.location.pathname.split('/')[1]
      )
    </script>
  </head>
  <body></body>
</html>
